<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Health Console</title>
  <meta name="description" content="Customer success health dashboard: usage trends, adoption and health scores from application activity logs." />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d5c63'/%3E%3Cpath d='M7 18h5l3-7 3 12 3-5h4' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <script>
    // On Vercel this stays unreplaced -> same-origin /api. In the sandbox preview it is rewritten to the proxy path.
    window.API_BASE = "__PORT_8000__".startsWith("__") ? "" : "__PORT_8000__";
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body class="signed-out">
  <div class="auth-screen" id="auth-screen" hidden></div>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="brand">
        <svg width="30" height="30" viewBox="0 0 32 32" aria-label="Customer Health Console"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M7 18h5l3-7 3 12 3-5h4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div><b>Customer Health</b><span>Usage engine</span></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="btn menu-btn" id="menu-btn" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="crumbs" id="crumbs"></div>
        <div class="spacer"></div>
        <span class="small muted hide-sm" id="through"></span>
        <a class="btn primary" href="#/upload" id="upload-cta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
          Upload data
        </a>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="drawer-bg" id="drawer-bg"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
